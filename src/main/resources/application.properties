##############################
## poi 内置配置（打包在 classpath 下，程序启动时自动加载，无需任何外部 conf 文件）
##
## 程序入参（命令行）：<filePath> <fileType> [outputType]
##   java -jar poi.jar <filePath> <fileType> [outputType]
##     filePath   : 待解析的 OSM 文件路径，例如 ./test/data/latest.osm.pbf
##     fileType   : 输入文件格式，取值 OSM_PBF 或 OSM_XML
##     outputType : 可选，输出类型，缺省为 0
##                    0 = 同时输出 .csv 与 SQLite 数据库文件（*.poi）【默认】
##                    1 = 仅输出 SQLite 数据库文件（*.poi）
##                    2 = 仅输出 .csv 文件
##
## 输出类型不再由本配置文件控制，统一改为命令行第 3 个参数。
## 运行时数据目录 dataPath 不再由外部传入，而是直接取输入文件所在目录。
## 结果文件（.csv / .poi，以及可选的 .nt）默认就写在该目录下，不再额外创建 output 子目录。
## 临时目录 <dataPath>/tmp 仅用于磁盘索引等中间文件，程序运行结束后会被自动删除。
##############################

##############################
# 运行目录
##############################

# 临时目录名：与 dataPath 拼接，存放磁盘索引（nodeIndex/wayIndex/relationIndex）等中间文件
# 该目录仅在运行期间存在，转换结束（无论成功失败）后自动删除；若配置为绝对路径则直接使用该路径
tmpDir = tmp

# 输出目录名：留空（默认）表示直接输出到 dataPath，即输入文件所在目录，不再创建 output 子目录
# 若需要单独的输出目录，可填相对目录名（相对 dataPath）或绝对路径
outputDir =

##############################
# CSV 输出相关配置
##############################

## [CSV only] 属性映射文件：OSM 标签 -> CSV 列的映射关系
## 该文件已随工程打包在 classpath 下（src/main/resources/mapping/Attribute_mapping.conf），
## 程序直接从这里读取，不再需要由外部 conf 文件或命令行传入。
## 文件内容说明：
##   - 左侧为 CSV 列名（如 STREET），右侧为逗号分隔的 OSM 标签列表（如 "addr:street"）；
##   - 命中标签的取值会写入该列，多个标签命中时以 ";" 连接；
##   - 未被映射的 OSM 标签统一以 JSON 形式写入 OTHER_TAGS 列；
##   - 所有 OSM 标签需使用双引号包裹。
## 也允许写成磁盘路径（如 D:/data/Attribute_mapping.conf），此时将按文件路径读取。
mapping_file = mapping/Attribute_mapping.conf

## 输出格式说明（不再由本文件控制，已改为命令行第 3 个参数 outputType）
##   outputType = 0（默认）：同时输出 .csv 文件与 SQLite 数据库文件（*.poi）
##   outputType = 1         ：仅输出 SQLite 数据库文件（*.poi）
##   outputType = 2         ：仅输出 .csv 文件
## SQLite 文件以数据集命名并以 .poi 结尾（例如输入 ./test/data/hong_kong.osm.pbf 时输出 ./test/data/hong_kong.poi），
## 内含单一数据表 poi，字段与 .csv 表头一一对应，并为 ID、NAME 建立索引。

##############################
# 其他转换参数（默认值即可满足 CSV 抽取，按需修改）
##############################

# 转换模式：STREAM（内存流式，当前唯一支持的模式）
mode = STREAM

# 每批次处理的记录数，仅影响进度输出频率，取值范围 1~1000
batchSize = 10

# 数据源（提供者）标识
featureSource = OpenStreetMap

# 分类方案（YAML）：用于按 OSM 标签给要素分配类别/子类别
# 留空或注释掉表示不使用分类方案，此时所有可用要素都会被提取，类别记为 node/way/relation
# classificationSpec = classification/OSM_tags_POI_classification.yml

# 是否忽略没有名称的要素（仅对 OSM 有效）。false 表示保留所有要素
keepUnnamedEntities = false

# 是否输出 RDF 三元组（.nt）。留空表示只输出 CSV（含可选的 .poi）
# serialization = N-TRIPLES
# targetGeoOntology = GeoSPARQL
# mappingSpec = mapping/OSM_ID_RDF_mapping.yml

# 命名空间与前缀（仅在输出 RDF 时生效）
# nsOntology = http://slipo.eu/def#
# geometryNS = http://www.opengis.net/ont/geosparql#
# nsFeatureURI = http://openstreetmap.org/
# nsClassURI = http://slipo.eu/id/term/
# nsClassificationURI = http://slipo.eu/id/classification/
# nsDataSourceURI = http://slipo.eu/id/poisource/
# prefixes = slipo, geo, xsd, rdfs, wgs84_pos
# namespaces = http://slipo.eu/def#, http://www.opengis.net/ont/geosparql#, http://www.w3.org/2001/XMLSchema#, http://www.w3.org/1999/02/22-rdf-syntax-ns#, http://www.w3.org/2003/01/geo/wgs84_pos#
# defaultLang = en
